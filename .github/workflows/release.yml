name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate signing configuration
        env:
          BUILD_CERTIFICATE_P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_P12_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER_ID: ${{ secrets.NOTARYTOOL_ISSUER_ID }}
          NOTARYTOOL_PRIVATE_KEY: ${{ secrets.NOTARYTOOL_PRIVATE_KEY }}
        run: |
          missing=()
          required_vars=(
            BUILD_CERTIFICATE_P12_BASE64
            BUILD_CERTIFICATE_PASSWORD
            BUILD_KEYCHAIN_PASSWORD
            DEVELOPER_ID_APPLICATION
            NOTARYTOOL_KEY_ID
            NOTARYTOOL_ISSUER_ID
            NOTARYTOOL_PRIVATE_KEY
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              missing+=("$var_name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secrets:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        id: signing
        env:
          BUILD_CERTIFICATE_P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_P12_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/grabber-build-cert.p12"
          keychain_path="$RUNNER_TEMP/grabber-signing.keychain-db"
          existing_keychains=()

          if ! printf '%s' "$BUILD_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path" 2>/dev/null; then
            printf '%s' "$BUILD_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          fi

          security create-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$BUILD_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$BUILD_KEYCHAIN_PASSWORD" "$keychain_path"

          while IFS= read -r keychain; do
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g')

          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          security default-keychain -d user -s "$keychain_path"

          echo "keychain-path=$keychain_path" >> "$GITHUB_OUTPUT"

      - name: Write notarization API key
        id: notary
        env:
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_PRIVATE_KEY: ${{ secrets.NOTARYTOOL_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${NOTARYTOOL_KEY_ID}.p8"
          printf '%s' "$NOTARYTOOL_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "key-path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Package release
        env:
          SIGN_RELEASE: "1"
          NOTARIZE_RELEASE: "1"
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER_ID: ${{ secrets.NOTARYTOOL_ISSUER_ID }}
          NOTARYTOOL_KEY_PATH: ${{ steps.notary.outputs.key-path }}
        run: ./scripts/package_release.sh "${{ steps.version.outputs.version }}" build/release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grabber-${{ steps.version.outputs.version }}
          path: |
            build/release/grabber-${{ steps.version.outputs.version }}.zip
            build/release/grabber-${{ steps.version.outputs.version }}.zip.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Grabber v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            build/release/grabber-${{ steps.version.outputs.version }}.zip
            build/release/grabber-${{ steps.version.outputs.version }}.zip.sha256
          generate_release_notes: true

      - name: Clean up signing keychain
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain-path }}
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
